name: Publish Scheduled News

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Publish Scheduled Cron Endpoint
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_BASE_URL or CRON_SECRET repository secrets."
            exit 1
          fi

          BASE_URL="${CRON_BASE_URL%/}"
          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            BASE_URL="https://$BASE_URL"
          fi
          SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          URL="$BASE_URL/api/cron/publish-scheduled"

          HTTP_CODE=$(curl -sS \
            -o /tmp/publish-scheduled-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $SECRET" \
            -H "x-cron-secret: $SECRET" \
            "$URL")

          cat /tmp/publish-scheduled-response.json
          echo
          echo "HTTP_STATUS=$HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Publish scheduled endpoint failed."
            exit 1
          fi
