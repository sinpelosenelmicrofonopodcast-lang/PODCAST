name: Lighthouse public site

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * *"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit public pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.sinpelosenelmicrofono.com/
            https://www.sinpelosenelmicrofono.com/noticias
            https://www.sinpelosenelmicrofono.com/podcast
            https://www.sinpelosenelmicrofono.com/publicidad
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
