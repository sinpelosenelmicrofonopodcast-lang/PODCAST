name: Admin Dashboard CI

on:
  pull_request:
    paths:
      - "app/admin/**"
      - "components/AdminShell.tsx"
      - "components/Sidebar.tsx"
      - "components/AdminSyncYouTube.tsx"
      - "lib/staffPermissions.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-dashboard-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://www.sinpelosenelmicrofono.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
      PUSH_SECRET: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
